<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    {% csrf_token %}
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>GraphRAG 10K Chat</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static '/chat.css' %}">
    <style>

        /* New styles for ticker sidebar */
        .layout-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .ticker-sidebar-wrapper {
            width: 20%;
            height: calc(100vh - 40px);
            padding: 20px;
            background-color: #f5f5f5;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .ticker-sidebar-wrapper h3 {
            text-align: center;
            font-family: Montserrat, sans-serif;
            color: #264b26;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .ticker-sidebar {
            width: 100%;
            height: 30vh;
            margin-bottom: 20px;
        }

        #ticker-search {
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #ticker-select {
            height: 20vh;
            font-family: Montserrat, sans-serif;
        }

        .chat-container {
            width: 80%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .download-button {
            width: 100%;
            height: 25px;
            border: 1px solid #264b26;
            border-radius: 20px;
            color: #264b26;
            font-size: 14px;
            cursor: pointer;
            background-color: antiquewhite;
            margin-top: 10px;
        }

        .buttons {
            margin-bottom: 20px;
        }

        .indexed-docs {
            height: 20vh;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .next-docs-to-index {
            height: 20vh;
            overflow-y: auto;
        }
    </style>
</head>
<body style="height: 100vh; overflow: hidden; margin: 0; padding: 0;">
<div class="layout-container">
    <!-- Ticker Sidebar - Load using htmx -->
    <div class="ticker-sidebar-wrapper">
        <div class="ticker-sidebar" hx-get="/tickers" hx-trigger="load" hx-swap="innerHTML"
             hx-indicator="#tickersSpinner">
        </div>
        <img style="bottom: 5%;" id="tickersSpinner" class="my-indicator"
             src="{% static '/three-dots.svg' %}" alt=""/>
    </div>

    <!-- Chat Container -->
    <div class="chat-container">
        <div style="width: 70%; margin: auto">
            <h1 style="text-align: center; font-family: Montserrat, sans-serif">GraphRAG 10K Chat</h1>
        </div>
        <div style="width: 90%; margin: auto; height: 60vh; overflow-y: scroll; top: 10px; padding: 0 5px 150px 5px;
        border: 0; border-bottom-left-radius: 10px; border-top-left-radius: 10px"
             id="chatBox">
        </div>
        <div style="height: 15vh; bottom: 0; width: 90%; margin: 20px auto auto auto;">
            <form id="chatForm" hx-get="/chat" hx-target="#chatBox" hx-swap="beforeend"
                  hx-on--after-request="this.reset()"
                  hx-disabled-elt="button" hx-trigger="submit, keyup[ctrlKey&&key=='Enter'] from:body"
                  hx-on:htmx:before-request="showQuestion()">
                <label for="question"></label>
                <textarea style="width: 70%; height: 80px; border: 0; border-radius: 20px; background-color: #264b26;
                                 float: left; font-size: 22px; padding: 5px 20px 5px 20px;"
                          type="text" name="question" id="question" placeholder="Write your question here"></textarea>
                <button style="width: 19%; height: 50px; border: 5px solid #264b26; border-radius: 20px; color: #264b26;
                               font-size: 22px; float: right; cursor: pointer; padding: 5px 20px 5px 20px"
                        type="submit"
                        hx-indicator="#spinner">Ask
                </button>
                <img style="position: absolute; bottom: 15%; left: 58%" id="spinner" class="my-indicator"
                     src="{% static '/three-dots.svg' %}" alt=""/>
            </form>
        </div>
    </div>
</div>

<script>
    function removeErrorElement() {
        let elementById = document.getElementById("error");
        if (elementById !== null) {
            console.log(elementById)
            elementById.remove();
        }
    }

    function showQuestion() {
        removeErrorElement();
        const questionElement = document.getElementById("question");
        const question = questionElement.value;
        if (question === '' || question === undefined || question === null) {
            return;
        }
        const questionDiv = createQuestionElement(question);
        const chatBox = document.getElementById('chatBox');
        chatBox.appendChild(questionDiv);
        scrollToView();
    }

    function scrollToView() {
        const chatBox = document.getElementById('chatBox');
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createQuestionElement(question) {
        const outerDiv = document.createElement('div');
        outerDiv.style.width = '100%';
        outerDiv.style.display = 'flex';
        outerDiv.style.justifyContent = 'flex-end';
        outerDiv.style.padding = '20px 0 20px 0';
        const innerDiv = document.createElement('div');
        innerDiv.style.fontSize = '20px';
        innerDiv.style.textAlign = 'center';
        innerDiv.style.border = '0';
        innerDiv.style.borderRadius = '30px';
        innerDiv.style.backgroundColor = 'lightgray';
        innerDiv.style.color = 'black';
        innerDiv.style.width = '75%';
        innerDiv.style.overflowWrap = 'break-word';
        innerDiv.style.overflow = 'hidden';
        innerDiv.style.height = 'fit-content';
        innerDiv.style.position = 'relative';
        innerDiv.style.padding = '10px 15px 10px 15px';
        innerDiv.style.float = 'right';
        innerDiv.style.fontFamily = 'Montserrat, sans-serif';
        innerDiv.style.letterSpacing = '0.7px';
        innerDiv.textContent = question;
        outerDiv.appendChild(innerDiv);
        return outerDiv;
    }

   document.addEventListener('DOMContentLoaded', function() {
        // Get the CSRF token from the meta tag
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        // Add a listener for all HTMX AJAX requests
        document.body.addEventListener('htmx:configRequest', function(event) {
            // Add the CSRF token to the headers
            event.detail.headers['X-CSRFToken'] = csrfToken;
        });
    });

</script>
</body>
</html>
