<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    {% csrf_token %}
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>GraphRAG 10K Chat</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{% static '/chat.css' %}">
    <style>


        /* New styles for ticker sidebar */
        .layout-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .ticker-sidebar-wrapper {
            width: 20%;
            height: calc(100vh - 40px);
            padding: 20px;
            background-color: #6E9887;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .ticker-sidebar-wrapper h3 {
            text-align: center;
            font-family: Montserrat, sans-serif;
            color: #264b26;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .ticker-sidebar {
            width: 100%;
            height: 30vh;
            margin-bottom: 20px;
        }

        #ticker-search {
            margin-bottom: 8px;
            border-radius: 12px;
            background-color: #F1FAEE;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            width: 100%;
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #ticker-select {
            height: 20vh;
            font-family: Montserrat, sans-serif;
            background-color: #F1FAEE;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .chat-container {
            width: 80%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .download-button {
            width: 100%;
            height: 25px;
            border: 1px solid #264b26;
            border-radius: 20px;
            color: #264b26;
            font-size: 14px;
            cursor: pointer;
            background-color: antiquewhite;
            margin-top: 10px;
        }

        .buttons {
            margin-bottom: 20px;
        }

        .card {
            background-color: #F1FAEE;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h3 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #333333;
            text-align: center;
        }

        .document-list {
            list-style-type: none;
            padding: 0;
            height: 12vh;
            overflow-y: auto;
            margin: 0;
        }

        .document-list li {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 16px;
        }

        .document-list li .icon {
            margin-right: 8px;
            font-size: 16px;
        }

        .document-list li a {
            text-decoration: none;
            color: #007acc;
            font-weight: 500;
            transition: color 0.3s;
        }

        .document-list li a:hover {
            color: #005a99;
            text-decoration: underline;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        :root {
            --input-bg-color: #ffffff; /* White background for input */
            --input-border-color: #dfe1e5; /* Subtle grey border */
            --input-focus-border-color: #8ab4f8; /* Light blue focus border */
            --input-text-color: #202124; /* Dark grey text */
            --input-placeholder-color: #5f6368; /* Lighter grey for placeholder */
            --button-bg-color: #f8f9fa; /* Light grey button background */
            --button-bg-hover-color: #f1f3f4; /* Slightly darker grey on hover */
            --button-text-color: #3c4043; /* Dark grey button text */
            --button-border-radius: 18px; /* Rounded corners */
            --input-padding-vertical: 10px;
            --input-padding-horizontal: 16px;
        }

        .chat-input-container {
            display: flex;
            align-items: flex-end; /* Align items to the bottom */
            padding: 8px;
            background-color: var(--input-bg-color);
            border: 1px solid var(--input-border-color);
            border-radius: var(--button-border-radius); /* Container matches button rounding */
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15); /* Subtle shadow */
            max-width: 700px; /* Example max width */
            width: 100%; /* Take available width up to max-width */
            box-sizing: border-box;
        }

        .chat-textarea {
            flex-grow: 1; /* Take up available space */
            border: none; /* Border is now on the container */
            background-color: transparent; /* Inherit container background */
            padding: var(--input-padding-vertical) var(--input-padding-horizontal);
            font-size: 16px;
            line-height: 1.5;
            color: var(--input-text-color);
            resize: none; /* Disable manual resizing handle */
            outline: none; /* Remove default focus outline */
            min-height: calc(1em * 1.5 + 2 * var(--input-padding-vertical)); /* Minimum height for one line */
            max-height: 200px; /* Optional: limit growth */
            overflow-y: auto; /* Add scrollbar if content exceeds max-height */
            box-sizing: border-box;
        }

        .chat-textarea::placeholder {
            color: var(--input-placeholder-color);
            opacity: 1; /* Firefox needs this */
        }

        .chat-textarea:focus-within .chat-input-container, /* Not quite right, need JS or :focus-within on container */
        .chat-input-container:has(.chat-textarea:focus) { /* Use :has() if browser support is sufficient */
            border-color: var(--input-focus-border-color);
            box-shadow: 0 0 0 2px var(--input-focus-border-color); /* Example focus ring */
        }

        .chat-button {
            flex-shrink: 0; /* Prevent button from shrinking */
            background-color: var(--button-bg-color);
            border: none;
            color: var(--button-text-color);
            padding: var(--input-padding-vertical) var(--input-padding-horizontal);
            border-radius: var(--button-border-radius);
            cursor: pointer;
            font-size: 14px; /* Slightly smaller font for button */
            font-weight: 500;
            margin-left: 8px; /* Space between textarea and button */
            outline: none;
            transition: background-color 0.2s ease;
            height: calc(1em * 1.5 + 2 * var(--input-padding-vertical)); /* Match min-height of textarea */
            line-height: 1.5; /* Match textarea line-height */
            box-sizing: border-box;
            align-self: center; /* Center button vertically if needed */
        }

        .chat-button:hover {
            background-color: var(--button-bg-hover-color);
        }

        .chat-button:active {
            background-color: #e8eaed; /* Slightly darker for active state */
        }

    </style>
</head>
<body style="height: 100vh; overflow: hidden; margin: 0; padding: 0; background-color: antiquewhite;">
<div class="layout-container">
    <!-- Ticker Sidebar - Load using htmx -->
    <div class="ticker-sidebar-wrapper">
        <div class="ticker-sidebar" hx-get="/tickers" hx-trigger="load" hx-swap="innerHTML"
             hx-indicator="#tickersSpinner">
        </div>
        <img style="top: 45%; left: 7vw" id="tickersSpinner" class="my-indicator"
             src="{% static '/three-dots.svg' %}" alt=""/>
    </div>

    <!-- Chat Container -->
    <div class="chat-container">
        <div style="width: 70%; margin: auto">
            <h1 style="text-align: center; font-family: Montserrat, sans-serif; color: #264b26">GraphRAG 10K Chat</h1>
        </div>
        <div style="width: 90%; margin: auto; height: 60vh; overflow-y: scroll; top: 10px; padding: 0 5px 150px 5px;
        border: 0; border-bottom-left-radius: 10px; border-top-left-radius: 10px"
             id="chatBox">
        </div>
        <div style="height: 15vh; bottom: 0; width: 90%; padding-left: 20%">
            <form id="chatForm" hx-get="/chat" hx-target="#chatBox" hx-swap="beforeend"
                  hx-on--after-request="this.reset()"
                  hx-disabled-elt="button" hx-trigger="submit, keyup[ctrlKey&&key=='Enter'] from:body"
                  hx-on:htmx:before-request="showQuestion()">
                <div class="chat-input-container">
                    <label for="question" class="visually-hidden">Chat Input</label> <textarea class="chat-textarea"
                                                                                               name="question"
                                                                                               id="question"
                                                                                               placeholder="Write your question here"
                                                                                               rows="1"></textarea>
                    <button class="chat-button"
                            type="submit"
                            hx-indicator="#spinner"
                            aria-label="Send message">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24px" height="24px"
                             fill="currentColor" aria-hidden="true" focusable="false">
                            <path d="M0 0h24v24H0V0z" fill="none"/>
                            <path d="m4 12 1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/>
                        </svg>
                    </button>
                </div>

                <img style="position: absolute; bottom: 15%; left: 58%;" id="spinner" class="my-indicator"
                     src="{% static '/three-dots.svg' %}" alt=""/>
            </form>
        </div>
    </div>
</div>

<script>
    function removeErrorElement() {
        let elementById = document.getElementById("error");
        if (elementById !== null) {
            console.log(elementById)
            elementById.remove();
        }
    }

    function showQuestion() {
        removeErrorElement();
        const questionElement = document.getElementById("question");
        const question = questionElement.value;
        if (question === '' || question === undefined || question === null) {
            return;
        }
        const questionDiv = createQuestionElement(question);
        const chatBox = document.getElementById('chatBox');
        chatBox.appendChild(questionDiv);
        scrollToView();
    }

    function scrollToView() {
        const chatBox = document.getElementById('chatBox');
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function createQuestionElement(question) {
        const outerDiv = document.createElement('div');
        outerDiv.style.width = '100%';
        outerDiv.style.display = 'flex';
        outerDiv.style.justifyContent = 'flex-end';
        outerDiv.style.padding = '20px 0 20px 0';
        const innerDiv = document.createElement('div');
        innerDiv.style.fontSize = '18px';
        innerDiv.style.textAlign = 'center';
        innerDiv.style.border = '1px solid #6E9887';
        innerDiv.style.borderRadius = '30px';
        innerDiv.style.backgroundColor = '#E3D3C2';
        innerDiv.style.color = 'black';
        innerDiv.style.width = '75%';
        innerDiv.style.overflowWrap = 'break-word';
        innerDiv.style.overflow = 'hidden';
        innerDiv.style.height = 'fit-content';
        innerDiv.style.position = 'relative';
        innerDiv.style.padding = '10px 15px 10px 15px';
        innerDiv.style.float = 'right';
        innerDiv.style.fontFamily = 'Montserrat, sans-serif';
        innerDiv.style.letterSpacing = '0.7px';
        innerDiv.textContent = question;
        outerDiv.appendChild(innerDiv);
        return outerDiv;
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Get the CSRF token from the meta tag
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        // Add a listener for all HTMX AJAX requests
        document.body.addEventListener('htmx:configRequest', function (event) {
            // Add the CSRF token to the headers
            event.detail.headers['X-CSRFToken'] = csrfToken;
        });
    });

</script>
</body>
</html>
